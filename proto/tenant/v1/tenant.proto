syntax = "proto3";

// Package содержит API v1 для работы с сервисом BotBooker
package tenant.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

option go_package = "github.com/botbooker/bb-core/pkg/proto/tenant/v1;tenant_v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "API v1 для работы с сервисом BotBooker"
    version: "1.0.0"
  }
  base_path: "/api/v1"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Введите JWT токен в формате: 'Bearer [token]'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

// Сервис управления арендаторами (организациями/клиентами/тенант)
service TenantService {
  rpc GetTenant(GetTenantRequest) returns (TenantResponse) {
    option (google.api.http) = {get: "/tenants/{uuid}"};
  }
  rpc CreateTenant(CreateTenantRequest) returns (TenantResponse) {
    option (google.api.http) = {
      post: "/tenants"
      body: "*"
    };
  }
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {get: "/tenants"};
  }
  rpc DeleteTenant(DeleteTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/tenants/{uuid}"};
  }
  // Изменить статус тенанта: приостановка, возобновление или мягкое удаление.
  rpc UpdateTenantStatus(UpdateTenantStatusRequest) returns (TenantResponse) {
    option (google.api.http) = {
      patch: "/tenants/{uuid}/status"
      body: "*"
    };
  }
  // Список участников тенанта
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/tenants/{tenant_uuid}/members"};
  }
  // Добавить участника в тенант
  rpc AddMember(AddMemberRequest) returns (MemberResponse) {
    option (google.api.http) = {
      post: "/tenants/{tenant_uuid}/members"
      body: "*"
    };
  }
  // Исключить участника из тенанта
  rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/tenants/{tenant_uuid}/members/{user_uuid}"};
  }
  // Изменить роль участника в тенанте
  rpc ChangeMemberRole(ChangeMemberRoleRequest) returns (MemberResponse) {
    option (google.api.http) = {
      patch: "/tenants/{tenant_uuid}/members/{user_uuid}"
      body: "*"
    };
  }
  // Передать владение тенантом другому участнику
  rpc TransferOwnership(TransferOwnershipRequest) returns (MemberResponse) {
    option (google.api.http) = {
      post: "/tenants/{tenant_uuid}/ownership"
      body: "*"
    };
  }
}

// Статус арендатора
enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_ACTIVE = 1;
  TENANT_STATUS_SUSPENDED = 2;
  TENANT_STATUS_DELETED = 3;
}

// Основная сущность арендатора
message Tenant {
  string uuid = 1 [(validate.rules).string.uuid = true];
  string name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  string slug = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  TenantStatus status = 4;
  map<string, string> metadata = 5; // Произвольные параметры/настройки
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Запрос на получение информации о тенанте по его UUID
message GetTenantRequest {
  string uuid = 1 [(validate.rules).string.uuid = true];
}

// Запрос на создание нового тенанта
message CreateTenantRequest {
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  string slug = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  map<string, string> metadata = 3;
}

// Ответ, содержащий данные тенанта
message TenantResponse {
  Tenant tenant = 1;
}

// Запрос списка тенантов с поддержкой пагинации
message ListTenantsRequest {
  int32 page_size = 1 [(validate.rules).int32.gte = 0];
  string page_token = 2;
}

// Ответ со списком тенантов и токеном следующей страницы
message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}

// Запрос на удаление тенанта по его UUID
message DeleteTenantRequest {
  string uuid = 1 [(validate.rules).string.uuid = true];
}

// Запрос на изменение статуса тенанта
message UpdateTenantStatusRequest {
  // UUID тенанта
  string uuid = 1 [(validate.rules).string.uuid = true];
  // Новый статус: active, suspended или deleted
  TenantStatus status = 2;
}

// Участник тенанта: роль принадлежит членству, а не профилю пользователя
message TenantMember {
  // UUID тенанта
  string tenant_uuid = 1;
  // UUID пользователя
  string user_uuid = 2;
  // Роль пользователя в тенанте: admin, operator, manager или client
  string role = 3;
  // Признак владельца тенанта
  bool is_owner = 4;
  // Когда пользователь вступил в тенант
  google.protobuf.Timestamp joined_at = 5;
  // Email участника для интерфейса управления участниками
  string email = 6;
  // Имя участника для интерфейса управления участниками
  string first_name = 7;
  // Фамилия участника для интерфейса управления участниками
  string last_name = 8;
}

// Запрос списка участников тенанта
message ListMembersRequest {
  // UUID тенанта
  string tenant_uuid = 1 [(validate.rules).string.uuid = true];
  // Размер страницы: 0 означает значение по умолчанию
  int32 page_size = 2 [(validate.rules).int32.gte = 0];
  // Токен следующей страницы из предыдущего ответа
  string page_token = 3;
}

// Ответ со списком участников тенанта
message ListMembersResponse {
  // Участники тенанта
  repeated TenantMember members = 1;
  // Токен следующей страницы: пустой, если страниц больше нет
  string next_page_token = 2;
}

// Запрос на добавление участника в тенант
message AddMemberRequest {
  // UUID тенанта
  string tenant_uuid = 1 [(validate.rules).string.uuid = true];
  // UUID пользователя
  string user_uuid = 2 [(validate.rules).string.uuid = true];
  // Роль участника: admin, operator, manager или client
  string role = 3 [(validate.rules).string = {max_len: 32}];
}

// Ответ с данными участника тенанта
message MemberResponse {
  // Участник тенанта
  TenantMember member = 1;
}

// Запрос на исключение участника из тенанта
message RemoveMemberRequest {
  // UUID тенанта
  string tenant_uuid = 1 [(validate.rules).string.uuid = true];
  // UUID пользователя
  string user_uuid = 2 [(validate.rules).string.uuid = true];
}

// Запрос на изменение роли участника
message ChangeMemberRoleRequest {
  // UUID тенанта
  string tenant_uuid = 1 [(validate.rules).string.uuid = true];
  // UUID пользователя
  string user_uuid = 2 [(validate.rules).string.uuid = true];
  // Новая роль участника: admin, operator, manager или client
  string role = 3 [(validate.rules).string = {max_len: 32}];
}

// Запрос на передачу владения тенантом
message TransferOwnershipRequest {
  // UUID тенанта
  string tenant_uuid = 1 [(validate.rules).string.uuid = true];
  // UUID участника, который станет владельцем
  string user_uuid = 2 [(validate.rules).string.uuid = true];
}
