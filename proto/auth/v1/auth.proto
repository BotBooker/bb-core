syntax = "proto3";

// Package содержит API v1 для работы с сервисом BotBooker
package auth.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "user/v1/user.proto";
import "validate/validate.proto";

option go_package = "github.com/botbooker/bb-core/pkg/proto/auth/v1;auth_v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "API v1 для работы с сервисом BotBooker"
    version: "1.0.0"
  }
  base_path: "/api/v1"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Введите JWT токен в формате: 'Bearer [token]'"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

// Сервис аутентификации: регистрация, вход, смена пароля и выход.
//
// Регистрация, вход и смена пароля открыты (токена ещё нет либо он недоступен):
// личность подтверждает пароль. Выход и чтение профиля требуют токен.
service AuthService {
  // Зарегистрировать нового пользователя (роль client) и сразу выдать токен
  rpc Register(AuthServiceRegisterRequest) returns (AuthServiceRegisterResponse) {
    option (google.api.http) = {
      post: "/auth/register"
      body: "*"
    };
  }

  // Войти по email и паролю и получить токен доступа
  rpc Login(AuthServiceLoginRequest) returns (AuthServiceLoginResponse) {
    option (google.api.http) = {
      post: "/auth/login"
      body: "*"
    };
  }

  // Сменить пароль, подтвердив личность текущим паролем, и выдать новую сессию
  rpc ChangePassword(AuthServiceChangePasswordRequest) returns (AuthServiceChangePasswordResponse) {
    option (google.api.http) = {
      post: "/auth/password"
      body: "*"
    };
  }

  // Выйти из системы: отозвать токен из заголовка Authorization
  rpc Logout(AuthServiceLogoutRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/auth/logout"
      body: "*"
    };
  }

  // Получить профиль действующего пользователя (пользователь берётся из токена)
  rpc GetCurrentUser(AuthServiceGetCurrentUserRequest) returns (AuthServiceGetCurrentUserResponse) {
    option (google.api.http) = {get: "/auth/me"};
  }

  // Список тенантов, в которых состоит действующий пользователь.
  // Нужен, чтобы выбрать tenant_slug для входа или переключения сессии.
  rpc ListMyTenants(AuthServiceListMyTenantsRequest) returns (AuthServiceListMyTenantsResponse) {
    option (google.api.http) = {get: "/auth/tenants"};
  }

  // Переключить действующую сессию на другой тенант.
  // Старый токен по умолчанию не отзывается: для полного выхода есть LogoutAll.
  rpc SwitchTenant(AuthServiceSwitchTenantRequest) returns (AuthServiceSwitchTenantResponse) {
    option (google.api.http) = {
      post: "/auth/tenant/switch"
      body: "*"
    };
  }

  // Выйти из системы на всех устройствах и во всех тенантах.
  rpc LogoutAll(AuthServiceLogoutAllRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/auth/logout-all"
      body: "*"
    };
  }
}

// Выданный доступ: подписанный токен и срок его действия
message Session {
  // Подписанный JWT: клиент присылает его в заголовке Authorization
  string token = 1;
  // Момент, когда токен перестаёт действовать
  google.protobuf.Timestamp expires_at = 2;
  // Тенант сессии: идентификатор нужен для аудита и переключения
  string tenant_uuid = 3;
  // Тенант сессии: slug нужен для ссылки и повторного входа
  string tenant_slug = 4;
  // Название тенанта для отображения в интерфейсе
  string tenant_name = 5;
  // Роль пользователя в тенанте сессии
  string role = 6;
}

// Запрос на самостоятельную регистрацию: профиль и пароль
message AuthServiceRegisterRequest {
  // Email обязателен и должен быть валидным адресом
  string email = 1 [(validate.rules).string.email = true];
  // Имя: от 1 до 100 символов
  string first_name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  // Фамилия: от 1 до 100 символов
  string last_name = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  // Отчество (опционально, до 100 символов)
  string middle_name = 4 [(validate.rules).string = {max_len: 100}];
  // Номер телефона в формате E.164 (необязательно, пустое значение допустимо)
  string phone_number = 5 [(validate.rules).string = {
    pattern: "^\\+[1-9]\\d{1,14}$"
    ignore_empty: true
  }];
  // Пол пользователя (по умолчанию GENDER_UNSPECIFIED)
  user.v1.Gender gender = 6;
  // Пароль: не короче 8 символов и не длиннее 128
  string password = 7 [(validate.rules).string = {
    min_len: 8
    max_len: 128
  }];
  // Slug тенанта, по ссылке которого идёт регистрация.
  // Пустое значение означает личный тенант (обратная совместимость).
  string tenant_slug = 8 [(validate.rules).string = {max_len: 100}];
}

// Ответ на регистрацию: созданный пользователь и выданная сессия
message AuthServiceRegisterResponse {
  // Созданный пользователь
  user.v1.User user = 1;
  // Выданный доступ
  Session session = 2;
}

// Запрос на вход по email и паролю
message AuthServiceLoginRequest {
  // Email зарегистрированного пользователя
  string email = 1 [(validate.rules).string.email = true];
  // Пароль пользователя
  string password = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 128
  }];
  // Slug тенанта. Пустое значение — самое раннее членство (обратная совместимость).
  string tenant_slug = 3 [(validate.rules).string = {max_len: 100}];
}

// Ответ на вход: выданная сессия
message AuthServiceLoginResponse {
  // Выданный доступ
  Session session = 1;
}

// Запрос на смену пароля: личность подтверждает текущий пароль
message AuthServiceChangePasswordRequest {
  // Email пользователя
  string email = 1 [(validate.rules).string.email = true];
  // Текущий пароль
  string current_password = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 128
  }];
  // Новый пароль: не короче 8 символов
  string new_password = 3 [(validate.rules).string = {
    min_len: 8
    max_len: 128
  }];
  // Slug тенанта. Пустое значение — самое раннее членство (обратная совместимость).
  string tenant_slug = 4 [(validate.rules).string = {max_len: 100}];
}

// Ответ на смену пароля: новая сессия
message AuthServiceChangePasswordResponse {
  // Выданный доступ
  Session session = 1;
}

// Запрос на выход из системы (токен берётся из заголовка Authorization)
message AuthServiceLogoutRequest {}

// Запрос профиля действующего пользователя (пользователь берётся из токена)
message AuthServiceGetCurrentUserRequest {}

// Ответ с профилем действующего пользователя
message AuthServiceGetCurrentUserResponse {
  // Профиль действующего пользователя
  user.v1.User user = 1;
}

// Членство действующего пользователя в тенанте
message TenantMembership {
  // Идентификатор тенанта
  string tenant_uuid = 1;
  // Slug тенанта: по нему выполняется вход и переключение сессии
  string tenant_slug = 2;
  // Название тенанта
  string tenant_name = 3;
  // Статус тенанта: active, suspended или deleted
  string status = 4;
  // Роль пользователя в этом тенанте
  string role = 5;
  // Признак владельца тенанта
  bool is_owner = 6;
  // Когда пользователь вступил в тенант
  google.protobuf.Timestamp joined_at = 7;
}

// Запрос списка тенантов действующего пользователя
message AuthServiceListMyTenantsRequest {}

// Ответ со списком тенантов действующего пользователя
message AuthServiceListMyTenantsResponse {
  // Членства пользователя, упорядоченные по времени вступления
  repeated TenantMembership tenants = 1;
}

// Запрос на переключение сессии на другой тенант
message AuthServiceSwitchTenantRequest {
  // Slug целевого тенанта
  string tenant_slug = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
}

// Ответ на переключение: новая сессия в целевом тенанте
message AuthServiceSwitchTenantResponse {
  // Выданный доступ
  Session session = 1;
}

// Запрос на выход из всех сессий (токен берётся из заголовка Authorization)
message AuthServiceLogoutAllRequest {}
