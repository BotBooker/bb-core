# Пример Secret для Helm: не коммитьте реальные значения.
# kubectl apply -f deploy/helm/bb-core/secret.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: bb-core-secrets
type: Opaque
stringData:
  DSN: postgres://bbcore:change-me@postgres:5432/bbcore?sslmode=require
  # openssl rand -base64 32
  # openssl rand -hex 32
  JWT_SECRET: change-me-to-a-random-32-byte-secret
