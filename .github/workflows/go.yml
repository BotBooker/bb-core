name: Run lint & Tests

permissions:
  contents: read
  security-events: read

on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/**
  pull_request:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - .github/workflows/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

      - name: Bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          format: sarif
          output: results.sarif

      # fix: "results": null
      - name: Fix Report
        if: always()
        run: |
          jq '.runs[0].results |= (. // [])' results.sarif > fixed_results.sarif
          mv fixed_results.sarif results.sarif

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.25", "1.26"]
        include:
          - os: ubuntu-latest
            go-build: ~/.cache/go-build
          - os: macos-latest
            go-build: ~/Library/Caches/go-build
    name: ${{ matrix.os }} @ Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.go-build }}
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Download dependencies
        run: go mod download

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          postgres-version: 16

      - name: Run Tests
        env:
          PG: postgres://postgres:postgres@localhost/postgres?sslmode=disable
        run: |
          go mod edit -go=${{ matrix.go }}
          TESTTAGS='-failfast -shuffle=off' make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ matrix.os }},go-${{ matrix.go }}
