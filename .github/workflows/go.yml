name: Run lint & Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('tools.mk', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobin-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Версия зафиксирована и совпадает с tools.mk: без неё экшен ставит latest.
          version: v2.15.0

      - name: golang-govulncheck-action
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

      - name: Bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          format: sarif
          output: results.sarif

      # fix: "results": null
      - name: Fix Report
        if: always()
        run: |
          jq '.runs[0].results |= (. // [])' results.sarif > fixed_results.sarif
          mv fixed_results.sarif results.sarif

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        go: ["1.26.10", "1.27.3"]
        include:
          - os: ubuntu
            go-build: ~/.cache/go-build
          - os: macos
            go-build: ~/Library/Caches/go-build
    name: ${{ matrix.os }} @ Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}-latest
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go modules and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.go-build }}
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Cache Go tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('tools.mk', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gobin-

      - name: Download dependencies
        run: |
          go mod edit -go=${{ matrix.go }}
          go mod download

      - name: Setup PostgreSQL
        id: postgresql
        uses: ikalnytskyi/action-setup-postgres@325155bfd7807b2a21ac9c2c7bb9b9a6eacc44df # v9
        with:
          postgres-version: 16

      - name: Setup Valkey
        uses: BotBooker/action-setup-valkey@aff46621afba341ed54bc805f526dfb7408d7ab9 # v1
        id: valkey

      - name: Run Tests
        env:
          DSN_TEST: ${{ steps.postgresql.outputs.connection-uri }}
          REDIS_HOST: ${{ steps.valkey.outputs.connection-uri }}
        run: GO_TEST_ARGS='-failfast -shuffle=off' make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: "${{ matrix.os }}:go-${{ matrix.go }},go-${{ matrix.go }}"
          token: ${{ secrets.CODECOV_TOKEN }}
